[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hush-player"
version = "0.1.0"
description = "Self-hosted media player that mutes profanity as you watch"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "PyYAML>=6.0", "smbprotocol>=1.13"]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
hush = "hush.__main__:main"

[tool.setuptools.packages.find]
include = ["hush*"]

[tool.setuptools.package-data]
hush = ["web/*", "web/fonts/*", "analysis/wordlists/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
