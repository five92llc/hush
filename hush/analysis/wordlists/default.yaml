# Hush default word list.
#
# Matching is done on whole words after lowercasing and stripping punctuation,
# so "hell" never matches "hello" and "ass" never matches "class".
#   word      exact word
#   word*     word and anything starting with it (fuck* -> fucking, fucker)
#   *word     anything ending with it (*fucker -> motherfucker)
#   "a b c"   a phrase: consecutive words (each word may use *)
#
# Every detection is stored with its category. Categories can be switched on
# and off in the player at any time without re-analyzing the movie.
# Copy this file, edit it, and point `analysis.wordlist` at your copy.

categories:
  strong:
    label: Strong profanity
    default: true
    words:
      - fuck*
      - "*fuck"
      - "*fucker*"
